workflows:
  ios-unsigned:
    name: iOS Unsigned IPA
    max_build_duration: 60
    environment:
      flutter: 3.41.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign
      - name: Package as IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -r kumaravelammalu.ipa Payload
    artifacts:
      - build/ios/iphoneos/kumaravelammalu.ipa
    publishing:
      email:
        recipients:
          - nibinp81@gmail.com
        notify:
          success: true
          failure: true
